name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Called by release.yml to build and ship a tagged release with the same jobs.
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (the release tag)
        type: string
        required: true
      release:
        description: Deploy to production
        type: boolean
        default: false

# A new push to the same PR/branch cancels the older, now-irrelevant run. Releases are never cancelled.
# (github.workflow is the caller's name when called, so releases get their own group.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.release }}

permissions:
  contents: read

# Flow: web (test + build once) -> platform jobs reuse that exact dist/.
#   web ──┬── android-debug   (wraps dist/ in the Android shell)
#         └── deploy-web      (uploads dist/ to Cloudflare Pages)
# A future ios job would sit next to android-debug the same way.
jobs:
  web:
    name: Lint, typecheck, test, web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # full history + tags: needed by scripts/version.mjs
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Version summary
        run: echo "Version \`$(node scripts/version.mjs)\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  android-debug:
    name: Android debug APK
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # Gradle reads the version via scripts/version.mjs
      # node_modules is still needed: the Android project links @capacitor/android from it.
      - uses: ./.github/actions/setup
      # Gradle 8.14 needs JDK <= 24; Capacitor 8 targets JDK 21. The runner already has the Android SDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Package the exact build the web job tested instead of rebuilding it.
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: dist
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Show APK version
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt"
          "$AAPT" dump badging android/app/build/outputs/apk/debug/*.apk \
            | grep -o "versionCode='[0-9]*' versionName='[^']*'" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  deploy-web:
    name: Deploy web (Cloudflare Pages)
    needs: web
    # Secrets aren't available to fork or Dependabot PRs; skip rather than fail.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (inputs.release || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Where each build goes (shown as a "View deployment" link on the PR/commit):
    #   release tag -> production   https://reinventing-the-wheel.pages.dev
    #   push to main -> staging     https://staging.reinventing-the-wheel.pages.dev
    #   pull request -> preview     https://<branch>.reinventing-the-wheel.pages.dev
    # ("main" is the Cloudflare production branch name, so only releases deploy with it.)
    environment:
      name: ${{ inputs.release && 'production' || (github.event_name == 'push' && 'staging' || 'preview') }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: reinventing-the-wheel
      PAGES_BRANCH: ${{ inputs.release && 'main' || (github.event_name == 'push' && 'staging' || github.head_ref) }}
    steps:
      # Deploy the exact files the web job built and tested.
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: dist
      # Idempotent: creates the Pages project on the first ever run, no-op afterwards.
      - name: Ensure Pages project exists
        run: |
          if ! npx --yes wrangler@4 pages project list | grep -qw "$PAGES_PROJECT"; then
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch main
          fi
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=${{ env.PAGES_BRANCH }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
