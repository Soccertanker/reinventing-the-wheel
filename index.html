<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2b2b" />
    <title>Reinventing the Wheel</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <!-- iOS: home-screen icon and full-screen standalone mode -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wheel" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <h1>Reinventing the Wheel</h1>
        <p class="muted small" id="lifetime"></p>
        <p class="small bonus" id="loop"></p>
        <nav id="tabs"></nav>
      </header>
      <section class="era-head">
        <h2 id="era-name"></h2>
        <p class="muted" id="era-tagline"></p>
        <div id="goal"><small id="goal-label"></small></div>
        <small class="bonus" id="bonus"></small>
      </section>
      <section id="view"></section>
      <ul id="log" aria-live="polite"></ul>
    </main>
    <footer>v<span id="version"></span></footer>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
